services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gdot
      POSTGRES_PASSWORD: gdot_dev
      POSTGRES_DB: gdotchat
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gdotminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gdot_minio_dev_change_me}
      # Optional SSE-S3 (format keyname:base64-32-bytes). Leave empty for local E2EE-only.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
